# 2026-07-27: the shell tool execs directly (no shell), so a command must be on
# THIS unit's PATH to be runnable at all. Without ~/.local/bin and ~/.cargo/bin,
# `pytest` and `cargo` are in tool_allowed_commands but fail with
# [Errno 2] No such file or directory — allowed-but-unrunnable, which just burns
# agent turns. Systemd's default user PATH does not include either.
[Service]
Environment=PATH=/home/ben/.local/bin:/home/ben/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin
