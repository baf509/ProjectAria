# The tmux server must be owned by aria-tmux.service, never by this unit.
#
# A tmux server inherits the cgroup of the client that first spawns it. When
# aria-api won that race the server lived here, so systemd's default
# KillMode=control-group tore down every watched `claude-*` session on each
# `systemctl --user restart aria-api`. Ordering aria-tmux first guarantees a
# server already exists, so aria-api only ever connects as a client.
[Unit]
Wants=aria-tmux.service
After=aria-tmux.service
