# DeepSeek V4 dual-GPU characterization temporarily needs essentially all of
# Strix Halo's shared memory.  Prevent background shell extraction from naming
# gemma-aux and prevent any other explicitly named request from auto-starting a
# mutually exclusive model while the guarded benchmark service is resident.
# Remove this drop-in after characterization/Hermes cutover.
[Service]
Environment=SHELLS_EXTRACTION_ENABLED=false
Environment=LLM_PROXY_AUTOSTART=false
