services:
  # =============================================================================
  # NOTE: The ARIA API runs natively on the host (not in Docker) so it can
  # access the filesystem, spawn sub-agents, and run shell commands.
  # Start it via: systemctl --user start aria-api
  # =============================================================================

  # =============================================================================
  # Text-to-Speech Service (Qwen3-TTS, CPU)
  #
  # Profile-gated: `shared-tts` (infrastructure/docker-compose.yml) already
  # owns :8002 and is the server ARIA's TTS_URL actually points at. Bringing
  # this one up alongside it fails on "port already allocated" -- it sat in
  # `docker ps` as permanently `Created` (never Up) since 2026-06-24 until
  # this was noticed. Only start it explicitly (`docker compose --profile
  # standalone-tts up -d tts`) if shared-tts is ever retired or you want
  # ARIA's own TTS build instead.
  # =============================================================================
  tts:
    build:
      context: ./tts
      dockerfile: Dockerfile
    container_name: aria-tts
    restart: unless-stopped
    profiles:
      - standalone-tts
    ports:
      - "8002:8002"
    networks:
      - shared-infra

  # =============================================================================
  # Speech-to-Text Service (whisper-large-v3-turbo via faster-whisper, CPU)
  # =============================================================================
  stt:
    build:
      context: ./stt
      dockerfile: Dockerfile
    container_name: aria-stt
    restart: unless-stopped
    ports:
      - "8003:8003"
    networks:
      - shared-infra

  # =============================================================================
  # ARIA Web UI
  # =============================================================================
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        # Only a build stamp is baked now — the API URL and key are read at
        # request time by the UI's server-side proxy, so changing either is
        # `docker compose up -d ui` rather than a rebuild, and neither reaches
        # the browser bundle.
        BUILD_SHA: ${BUILD_SHA:-unknown}
        BUILD_BRANCH: ${BUILD_BRANCH:-}
    container_name: aria-ui
    restart: unless-stopped
    ports:
      # Bound to loopback: the browser reaches this through `tailscale serve`
      # over https, and the container's /api/v1 proxy is an authenticated path
      # to the whole API, so it must not listen on 0.0.0.0.
      - "127.0.0.1:3000:3000"
    environment:
      - ARIA_API_URL=${ARIA_API_URL:-http://host.docker.internal:8200}
      - ARIA_API_KEY=${API_KEY:?API_KEY must be set in .env}
    extra_hosts:
      # aria-api is a host systemd service, not a container.
      - "host.docker.internal:host-gateway"
    networks:
      - shared-infra

networks:
  shared-infra:
    external: true
